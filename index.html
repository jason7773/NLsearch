<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NLsearch</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- Soft colour behind the glass style; the paper style hides it. -->
    <div id="ambient" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

    <header>
      <div class="topbar">
        <div class="brand"><b>NL</b>search</div>
        <span class="grow"></span>
        <button id="folders-toggle" class="pill" data-i18n-title="folders.title">
          <span class="icon" data-icon="folder"></span><span data-i18n="folders">Folders</span><span id="folder-count" hidden></span>
        </button>
        <button id="settings-open" class="subtle" data-i18n-title="settings.title"><span class="icon" data-icon="gear"></span></button>
        <button id="about-open" class="subtle" data-i18n-title="about.title"><span class="icon" data-icon="info"></span></button>
      </div>
      <div class="searchbox">
        <span class="icon" data-icon="search"></span>
        <input id="query" type="text" data-i18n-placeholder="search.placeholder" autocomplete="off" spellcheck="false" autofocus />
        <span id="spinner" class="spinner" hidden></span>
        <button id="clear" class="subtle" data-i18n-title="search.clear" hidden><span class="icon" data-icon="close"></span></button>
      </div>
      <div class="toolbar">
        <div id="filters" class="segmented" role="tablist">
          <button data-filter="all" class="active" role="tab" data-i18n="tab.all">All</button>
          <button data-filter="docs" role="tab" data-i18n="tab.docs">Documents</button>
          <button data-filter="images" role="tab" data-i18n="tab.images">Images</button>
        </div>
        <span id="similar" class="chip" hidden>
          <span class="icon" data-icon="sparkle"></span><span id="similar-text"></span>
          <button id="similar-clear" class="subtle" data-i18n-title="similar.clear"><span class="icon" data-icon="close"></span></button>
        </span>
        <span id="meta"></span>
        <select id="sort" data-i18n-title="sort.title">
          <option value="relevance" data-i18n="sort.relevance">Best match</option>
          <option value="newest" data-i18n="sort.newest">Newest first</option>
          <option value="oldest" data-i18n="sort.oldest">Oldest first</option>
        </select>
        <button id="filters-toggle" class="subtle" data-i18n-title="filters.title"><span class="icon" data-icon="filter"></span></button>
        <button id="preview-toggle" class="subtle" data-i18n-title="preview.toggle"><span class="icon" data-icon="panel"></span></button>
      </div>
      <div id="filterbar" hidden>
        <select id="filter-date">
          <option value="" data-i18n="filter.anytime">Any time</option>
          <option value="1" data-i18n="filter.day">Past day</option>
          <option value="7" data-i18n="filter.week">Past week</option>
          <option value="31" data-i18n="filter.month">Past month</option>
          <option value="365" data-i18n="filter.year">Past year</option>
        </select>
        <select id="filter-folder"></select>
        <select id="filter-type"></select>
        <button id="filters-clear" class="subtle wide" data-i18n="filter.clear">Clear</button>
      </div>
    </header>

    <div id="notices">
      <div id="banner" class="notice" hidden>
        <span class="icon" data-icon="info"></span>
        <span id="banner-text" class="notice-text"></span>
        <button id="banner-action"></button>
      </div>
      <div id="tip" class="notice" hidden>
        <span class="icon" data-icon="bolt"></span>
        <span class="notice-text" data-i18n="tip.gpu"></span>
        <button id="tip-action" class="accent"></button>
        <button id="tip-dismiss" class="subtle" data-i18n-title="tip.later"><span class="icon" data-icon="close"></span></button>
      </div>
      <div id="update" class="notice" hidden>
        <span class="icon" data-icon="download"></span>
        <span id="update-text" class="notice-text"></span>
        <button id="update-action" class="accent"></button>
        <button id="update-dismiss" class="subtle" data-i18n-title="tip.later"><span class="icon" data-icon="close"></span></button>
      </div>
    </div>

    <div id="content">
      <main id="results" class="panel"></main>
      <aside id="preview" class="panel">
        <div id="preview-empty" class="preview-empty" data-i18n="preview.empty"></div>
        <div id="preview-body" hidden>
          <div id="preview-media"></div>
          <h2 id="preview-name"></h2>
          <div id="preview-meta"></div>
          <div class="preview-actions">
            <button id="pv-open" class="accent"><span class="icon" data-icon="open"></span><span data-i18n="action.open"></span></button>
            <button id="pv-reveal"><span class="icon" data-icon="folder"></span><span data-i18n="action.reveal"></span></button>
            <button id="pv-similar"><span class="icon" data-icon="sparkle"></span><span data-i18n="action.similar"></span></button>
            <button id="pv-copy-path" class="subtle" data-i18n-title="action.copyPath"><span class="icon" data-icon="link"></span></button>
            <button id="pv-copy-text" class="subtle" data-i18n-title="action.copyText"><span class="icon" data-icon="copy"></span></button>
          </div>
          <div id="preview-text"></div>
        </div>
      </aside>
    </div>

    <footer>
      <div id="progress"><div id="progress-fill"></div></div>
      <span id="dot"></span>
      <span id="status"></span>
      <span id="backend" hidden></span>
      <span class="hints">
        <kbd>Enter</kbd> <span data-i18n="hint.open"></span> <kbd>Ctrl</kbd><kbd>Enter</kbd> <span data-i18n="hint.reveal"></span>
        <kbd>Esc</kbd> <span data-i18n="hint.hide"></span>
      </span>
    </footer>

    <dialog id="about">
      <h2 id="about-name">NLsearch</h2>
      <p id="about-version" class="about-version"></p>
      <p data-i18n="about.text"></p>
      <dl>
        <dt data-i18n="about.model"></dt>
        <dd data-i18n="about.modelName"></dd>
        <dt data-i18n="about.runningOn"></dt>
        <dd id="about-engine"></dd>
        <dt data-i18n="about.index"></dt>
        <dd id="about-index"></dd>
        <dt data-i18n="about.license"></dt>
        <dd data-i18n="about.licenseText"></dd>
      </dl>
      <div class="dialog-actions">
        <button id="about-close" class="accent" data-i18n="close"></button>
      </div>
    </dialog>

    <dialog id="settings">
      <h2 data-i18n="settings.title"></h2>

      <section>
        <h3 data-i18n="set.appearance"></h3>
        <p data-i18n="set.appearanceText"></p>
        <div class="setting-row">
          <div id="style" class="segmented" role="radiogroup">
            <button data-style="glass" role="radio"><span class="swatch glass"></span><span data-i18n="set.glass"></span></button>
            <button data-style="paper" role="radio"><span class="swatch paper"></span><span data-i18n="set.paper"></span></button>
          </div>
          <div id="theme" class="segmented" role="radiogroup">
            <button data-theme="system" role="radio" data-i18n="set.system"></button>
            <button data-theme="light" role="radio" data-i18n="set.light"></button>
            <button data-theme="dark" role="radio" data-i18n="set.dark"></button>
          </div>
        </div>
      </section>

      <section>
        <h3 data-i18n="set.language"></h3>
        <p data-i18n="set.languageText"></p>
        <select id="language">
          <option value="system" data-i18n="set.languageSystem"></option>
          <option value="en">English</option>
          <option value="zh-TW">繁體中文</option>
        </select>
      </section>

      <section>
        <h3 data-i18n="set.history"></h3>
        <p data-i18n="set.historyText"></p>
        <label class="check"><input id="history-keep" type="checkbox" /> <span data-i18n="set.historyKeep"></span></label>
        <div class="section-actions">
          <button id="history-clear" data-i18n="set.historyClear"></button>
        </div>
      </section>

      <section>
        <h3 data-i18n="set.gpu"></h3>
        <p id="gpu-state"></p>
        <button id="gpu-action" class="accent" hidden></button>
      </section>

      <section>
        <h3 data-i18n="set.model"></h3>
        <p id="model-state"></p>
        <button id="model-action" class="accent" hidden></button>
      </section>

      <section>
        <h3 data-i18n="set.startup"></h3>
        <label class="check"><input id="autostart" type="checkbox" /> <span data-i18n="set.autostart"></span></label>
      </section>

      <section>
        <h3 data-i18n="set.ocr"></h3>
        <p id="ocr-state"></p>
        <label class="check"><input id="ocr" type="checkbox" /> <span data-i18n="set.ocrOn"></span></label>
      </section>

      <section>
        <h3 data-i18n="set.exclude"></h3>
        <p data-i18n="set.excludeText"></p>
        <textarea id="exclude" rows="4" spellcheck="false" placeholder="Archive&#10;*.tmp&#10;D:\Photos\Old"></textarea>
        <div class="section-actions">
          <button id="exclude-save" data-i18n="save"></button>
        </div>
      </section>

      <section>
        <h3 data-i18n="set.updates"></h3>
        <p id="update-state"></p>
        <label class="check"><input id="update-auto" type="checkbox" /> <span data-i18n="set.updateAuto"></span></label>
        <div class="section-actions">
          <button id="update-check" data-i18n="set.updateCheck"></button>
          <button id="update-install" class="accent" hidden></button>
        </div>
      </section>

      <div id="download" hidden>
        <div class="bar"><div id="download-fill"></div></div>
        <div class="download-row">
          <span id="download-text"></span>
          <button id="download-cancel" data-i18n="cancel"></button>
        </div>
      </div>
      <p id="download-error" class="error" hidden></p>

      <div class="dialog-actions">
        <button id="settings-close" data-i18n="close"></button>
      </div>
    </dialog>

    <div id="backdrop" hidden></div>
    <aside id="drawer" aria-hidden="true">
      <div class="drawer-head">
        <h2 data-i18n="folders"></h2>
        <button id="drawer-close" class="subtle" data-i18n-title="drawer.close"><span class="icon" data-icon="close"></span></button>
      </div>
      <p class="drawer-intro" data-i18n="drawer.intro"></p>
      <ul id="folders"></ul>
      <div class="drawer-actions">
        <button id="add-folder" class="accent"><span class="icon" data-icon="plus"></span><span data-i18n="drawer.add"></span></button>
        <button id="reindex" data-i18n-title="drawer.rescanTitle"><span class="icon" data-icon="refresh"></span><span data-i18n="drawer.rescan"></span></button>
      </div>
    </aside>

    <div id="drop" hidden>
      <div class="drop-card">
        <span class="icon" data-icon="folder"></span>
        <span data-i18n="drop.hint"></span>
      </div>
    </div>

    <div id="toast" role="status"></div>
  </body>
</html>
