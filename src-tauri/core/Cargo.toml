[package]
name = "nlsearch-core"
version = "0.1.0"
description = "Indexing and search for NLsearch, without the desktop shell"
authors = ["jason7773"]
license = "MIT"
edition = "2021"

# Nothing here depends on Tauri or Windows, so `cargo test -p nlsearch-core` runs anywhere.
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
encoding_rs = "0.8"
chardetng = "0.1"
ureq = { version = "2", features = ["json"] }
walkdir = "2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
pdf-extract = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
