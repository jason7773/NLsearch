name: Release

# Pushing a tag such as v0.1.0 builds the Windows installers and a portable zip and
# publishes them as a GitHub release. "Run workflow" builds them, and publishes a release too
# when a version such as v0.1.0 is entered.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create, such as v0.1.0 (leave empty to build without publishing)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Link the C runtime statically so the executable needs no Visual C++ redistributable.
      # Set for the whole job so the portable zip reuses the installer's executable.
      RUSTFLAGS: -C target-feature=+crt-static
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # The CPU backend ships inside the installer so search works with no extra download.
      - name: Fetch llama.cpp CPU backend
        shell: pwsh
        run: |
          $zip = 'llama-b11552-bin-win-cpu-x64.zip'
          Invoke-WebRequest "https://github.com/ggml-org/llama.cpp/releases/download/b11552/$zip" -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'c00741179811ff903b515eae28bdeef1f47af6e81c49920c4e68b62954e056d6') { throw "checksum mismatch: $hash" }
          New-Item -ItemType Directory -Force runtime/llama-cpu | Out-Null
          Expand-Archive $zip runtime/llama-cpu -Force

      # The app reports, and the updater compares, the version in tauri.conf.json.
      - name: Set version from the tag
        if: env.TAG != ''
        shell: pwsh
        run: |
          $version = $env:TAG -replace '^v', ''
          $path = 'src-tauri/tauri.conf.json'
          (Get-Content $path -Raw) -replace '"version": "[^"]*"', "`"version`": `"$version`"" | Set-Content $path -NoNewline

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update packages; installed copies verify them with the public key
          # in tauri.conf.json before installing.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ env.TAG }}
          releaseName: NLsearch ${{ env.TAG }}
          releaseBody: |
            Download **NLsearch_*_x64-setup.exe** (installer) or **NLsearch-lite.zip** (portable, no install).
            On first run, click **Download model** (about 825 MB, one time).
          releaseDraft: false
          prerelease: false
          # latest.json, which installed copies read to find updates, points at the setup.exe.
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.conf.json

      - name: Build portable zip
        shell: pwsh
        run: pwsh scripts/package-portable.ps1 -Lite -Zip -SkipBuild

      - name: Upload portable zip to the release
        if: env.TAG != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload $env:TAG dist-portable/NLsearch-lite.zip --clobber

      - uses: actions/upload-artifact@v4
        if: env.TAG == ''
        with:
          name: windows-build
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            dist-portable/NLsearch-lite.zip
